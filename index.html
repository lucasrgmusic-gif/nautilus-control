<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nautilus</title>
    <style>
        :root { --bg: #050505; --text: #f0f0f0; --accent: #0a84ff; --danger: #ff453a; --success: #32d74b; --panel: #111; }
        html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100%; width: 100%; position: fixed; touch-action: none; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        .active { display: flex; }
        
        /* Layout Setup */
        #setup select, #setup button { width: 80%; max-width: 300px; padding: 15px; margin: 10px; border-radius: 8px; font-size: 16px; background: #222; color: #fff; border: 1px solid #444; }
        
        /* Main Interface */
        #main-container { display: flex; width: 100vw; height: 80vh; margin-top: 5px; }
        .q-display { flex: 1.2; padding: 10px 20px; border-right: 2px solid #222; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
        .q-mixer { flex: 0.8; padding: 10px; background: var(--panel); display: flex; flex-direction: column; justify-content: center; }
        
        /* Typography */
        .info-label { font-size: 9px; color: #666; text-transform: uppercase; }
        .val-trans { font-size: 42px; font-weight: 900; color: var(--accent); line-height: 1; }
        .val-time { font-size: 28px; font-weight: 700; color: #fff; }
        .val-mode { font-size: 24px; font-weight: 700; color: #ccc; }
        
        /* Status Bar */
        .status-bar { padding: 8px; border-radius: 6px; text-align: center; font-size: 12px; font-weight: 900; margin-top: 10px; width: fit-content; }
        .status-on { background: rgba(50, 215, 75, 0.2); color: var(--success); border: 1px solid var(--success); }
        .status-off { background: rgba(255, 69, 58, 0.2); color: var(--danger); border: 1px solid var(--danger); }

        /* Mixer Bars */
        .bar-fill { position: absolute; bottom: 0; width: 100%; background: linear-gradient(to top, #0a84ff, #5efce8); transition: height 0.1s linear; }
        .cc-label { font-size: 10px; color: #888; font-weight: bold; text-align: center; }
        /* Garante que o container das barras tenha altura */
        .mixer { display: flex; justify-content: space-around; align-items: flex-end; height: 160px; gap: 8px; margin-bottom: 5px; }
        .bar-outer { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 5px; }
        .bar-container { width: 35px; height: 120px; background: #000; border-radius: 4px; position: relative; overflow: hidden; border: 1px solid #333; }
        .cc-value { font-size: 11px; color: var(--accent); font-family: monospace; font-weight: 900; min-height: 14px; }


    </style>
</head>
<body>

    <audio id="silent-audio" loop><source src="https://google.com"></audio>

    <div id="setup" class="screen active">

        
         <!-- VERSAO AQUI -------------------------- V ---------->
        
        <h2 style="color: var(--accent)">Nautilus v1.6.1</h2>
        <button id="btn-init">MIDI</button>
        <select id="midi-in"></select>
        <select id="midi-out"></select>
        <button id="btn-ok" style="background: var(--success); border:none;">CONECTAR</button>
    </div>

    <div id="main" class="screen">
        <div id="main-container">
            <div class="q-display">
                <div>
                    <div class="info-label">Transição</div>
                    <div id="disp-trans" class="val-trans">Início</div>
                </div>
                <div>
                    <div class="info-label">Tempo & Modo</div>
                    <div id="disp-time" class="val-time">0.0s</div>
                    <div id="disp-mode" class="val-mode">Natural</div>
                </div>
                <div id="txt-active" class="status-bar status-off">CONTROLE INATIVO</div>
            </div>

            <div class="q-mixer">
                <div class="mixer">
    <div class="bar-outer">
        <div id="val-101" class="cc-value">0</div>
        <div class="bar-container"><div id="bar101" class="bar-fill"></div></div>
    </div>
    <div class="bar-outer">
        <div id="val-102" class="cc-value">0</div>
        <div class="bar-container"><div id="bar102" class="bar-fill"></div></div>
    </div>
    <div class="bar-outer">
        <div id="val-103" class="cc-value">0</div>
        <div class="bar-container"><div id="bar103" class="bar-fill"></div></div>
    </div>
    <div class="bar-outer">
        <div id="val-104" class="cc-value">0</div>
        <div class="bar-container"><div id="bar104" class="bar-fill"></div></div>
    </div>
</div>    
                <div style="display: flex; justify-content: space-around;">
                    <span class="cc-label">CC 101</span><span class="cc-label">CC 102</span>
                    <span class="cc-label">CC 103</span><span class="cc-label">CC 104</span>
                </div>
            </div>
        </div>
    </div>

<script>
    let midiAccess = null, input = null, output = null, isMidiActive = false;
    let currentTransition = "Início", currentKeyboardMode = "Natural", keyboardModeOnly = false;
    let ccLevels = { 101: 127, 102: 0, 103: 0, 104: 0 }, transInterval = null;
    let upLock = false, downLock = false, lastJoystickTime = 0;
    let currentTransIndex = 0;
    
    const SYSEX_HDR = [0xF0, 0x42, 0x30, 0x00, 0x01, 0x5D];
    const CHS_1_5 = [0x00, 0x01, 0x02, 0x03, 0x04];

    // Worker para manter timers em segundo plano
    const timerWorkerCode = `let t = null; self.onmessage = e => { if(e.data.action==='start'){ t=setInterval(()=>self.postMessage('tick'),e.data.interval)} else clearInterval(t); }`;
    const timerWorker = new Worker(URL.createObjectURL(new Blob([timerWorkerCode], {type: 'text/javascript'})));

    document.getElementById('btn-init').onclick = async () => {
        try {
            midiAccess = await navigator.requestMIDIAccess({ sysex: true });
            const i = document.getElementById('midi-in'), o = document.getElementById('midi-out');
            i.innerHTML = ""; o.innerHTML = "";
            midiAccess.inputs.forEach(p => i.add(new Option(p.name, p.id)));
            midiAccess.outputs.forEach(p => o.add(new Option(p.name, p.id)));
            if ('wakeLock' in navigator) navigator.wakeLock.request('screen');
        } catch(e) { alert("Erro ao acessar MIDI: " + e); }
    };

    document.getElementById('btn-ok').onclick = () => {
        input = midiAccess.inputs.get(document.getElementById('midi-in').value);
        output = midiAccess.outputs.get(document.getElementById('midi-out').value);
        if (output) {
            input.onmidimessage = handleMidi;
            document.getElementById('setup').classList.remove('active');
            document.getElementById('main').classList.add('active');
            document.getElementById('silent-audio').play();
        }
    };

    async function sendSysex(data) {
        if (!output) return;
        output.send([...SYSEX_HDR, ...data, 0xF7]);
        await new Promise(r => setTimeout(r, 12));
    }

    async function setStatus(active) {
        isMidiActive = active;
        const el = document.getElementById('txt-active');
        const modeTxt = keyboardModeOnly ? " (TECLADO)" : " (COMPLETO)";
        el.innerText = active ? "CONTROLE ATIVO" + modeTxt : "CONTROLE INATIVO";
        el.className = `status-bar ${active ? 'status-on' : 'status-off'}`;
        document.querySelector('.q-mixer').style.opacity = (active && !keyboardModeOnly) ? "1" : "0.3";
        await sendSysex([0x6D, 0x05, 0x00, 0x00, 0x03, 0x00, 0x00, 0x00, active ? 0x01 : 0x00]);
    }

 
    async function updateChannelMutes(code) {
    if (code === 0 || code === 1) { // Transição 1 e 2
        await sendSysex([0x43, 0x04, 0x05, 0x00, 0x0E, 0x00, 0x00, 0x00, 0x00]); // Ch 6 Unmute
        await sendSysex([0x43, 0x04, 0x06, 0x00, 0x0E, 0x00, 0x00, 0x00, 0x01]); // Ch 7 Mute
    } else if (code === 2 || code === 3) { // Transição 3 e 4
        await sendSysex([0x43, 0x04, 0x05, 0x00, 0x0E, 0x00, 0x00, 0x00, 0x01]); // Ch 6 Mute
        await sendSysex([0x43, 0x04, 0x06, 0x00, 0x0E, 0x00, 0x00, 0x00, 0x00]); // Ch 7 Unmute
    }
    }


    async function syncHardwareInstant() {
    const code = currentTransIndex;
    const mode = currentKeyboardMode;

    // 1. Cena (Transição)
    await sendSysex([0x6D, 0x05, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, code]);

    // 2. Modos de Teclado e SWs
    if (mode === "Baixo") {
        await sendSysex([0x43, 0x1B, 0x00, 0x00, 0x06, 0x01, 0x00, 0x00, 0x01]); // SW1 ON
    } else if (mode === "Solo") {
        await sendSysex([0x43, 0x1B, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01]); // SW2 ON
    } else { // Natural
        await sendSysex([0x43, 0x1B, 0x00, 0x00, 0x06, 0x01, 0x00, 0x00, 0x00]); // SW1 OFF
        await sendSysex([0x43, 0x1B, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x00]); // SW2 OFF
    }

    // 3. Mutes dos Canais 6 e 7
    await updateChannelMutes(code);

    // 4. Volumes CC (Instantâneo)
    let targets = {};
    if (code === 0) targets = {101:127, 102:0, 103:0, 104:0};
    else if (code === 1) targets = {101:115, 102:115, 103:0, 104:0};
    else if (code === 2) targets = {101:105, 102:105, 103:80, 104:50};
    else if (code === 3) targets = {101:80, 102:80, 103:127, 104:127};

    Object.keys(targets).forEach(cc => {
        let logVal = Math.round(127 * Math.pow(targets[cc] / 127, 1.5));
        output.send([0xB0, parseInt(cc), logVal]);
        ccLevels[cc] = targets[cc];
        document.getElementById(`bar${cc}`).style.height = (logVal / 127 * 100) + '%';
        document.getElementById(`val-${cc}`).innerText = logVal;
    });

    document.getElementById('disp-trans').innerText = ["Início", "ParteA", "ParteB", "Final"][code];
    document.getElementById('disp-mode').innerText = mode;
}



    async function handleMidi(e) {
        const d = Array.from(e.data);
        const status = d[0] & 0xF0, channel = d[0] & 0x0F, now = Date.now();
        const hex = d.map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ');

         // --- CONTINUIDADE / PROGRAM CHANGE (0xC0) ---
              if (status === 0xC0) {
            const keepTrans = currentTransIndex;
            const keepMode = currentKeyboardMode;

            // Mantém a UI estável enquanto o hardware carrega
            document.getElementById('disp-trans').innerText = ["Início", "ParteA", "ParteB", "Final"][keepTrans];
            document.getElementById('disp-mode').innerText = keepMode;

            await new Promise(r => setTimeout(r, 350)); 
            
            if (channel === 4) { // CANAL 5: TUDO MANTIDO
                keyboardModeOnly = false;
                await setStatus(true);
                currentTransIndex = keepTrans;
                currentKeyboardMode = keepMode;
                
                // Primeiro aplicamos os parâmetros de canal (Mutes/Volumes)
                await setKeyboardMode(currentKeyboardMode); 
                // Depois sincronizamos os botões SW e Cena
                await syncHardwareInstant(); 
            } 
            else if (channel === 3) { // CANAL 4: RESET TRANSIÇÃO
                keyboardModeOnly = true;
                await setStatus(true);
                currentTransIndex = 0; 
                currentKeyboardMode = keepMode;
                await setKeyboardMode(currentKeyboardMode);
                await syncHardwareInstant();
            } 
            else { 
                await setStatus(false);
                currentTransIndex = 0;
                currentKeyboardMode = "Natural";
                await syncHardwareInstant();
            }
            return;
        }



        if (!isMidiActive) return;

        // --- JOYSTICK (Bloqueado se for keyboardModeOnly) ---
        if (status === 0xB0 && !keyboardModeOnly) {
            if (d[1] === 1) { // Modulation Y+
                if (d[2] >= 40 && !upLock && (now - lastJoystickTime > 300)) {
                    if (currentTransIndex < 3) handleTransitionTrigger(currentTransIndex + 1);
                    upLock = true; lastJoystickTime = now;
                } else if (d[2] < 15) upLock = false;
            }
            if (d[1] === 2) { // Breath Y-
                if (d[2] >= 40 && !downLock && (now - lastJoystickTime > 300)) {
                    if (currentTransIndex > 0) handleTransitionTrigger(currentTransIndex - 1);
                    downLock = true; lastJoystickTime = now;
                } else if (d[2] < 15) downLock = false;
            }
        }

        // Sincronia de Gatilho e Modos via Sysex
        if (!keyboardModeOnly && hex.includes("5D 6D 05 00 00 01 00 00 00")) handleTransitionTrigger(d[d.length - 2], true);
        if (hex.includes("5D 43 1B 00 00 06")) {
            if (d[11] === 1 && d[14] === 1) setKeyboardMode("Baixo");
            else if (d[11] === 0 && d[14] === 1) setKeyboardMode("Solo");
            else setKeyboardMode("Natural");
        }
    }

    async function handleTransitionTrigger(code, skipSysex = false) {
        if (keyboardModeOnly && !skipSysex) {
            currentTransIndex = code;
            document.getElementById('disp-trans').innerText = ["Início","ParteA","ParteB","Final"][code];
            return;
        }
        if (!skipSysex) await sendSysex([0x6D, 0x05, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, code]);
        
        const old = currentTransition;
        let targets = {}, next = "";
        if (code === 0) { next = "Início"; targets = {101:127, 102:0, 103:0, 104:0}; }
        else if (code === 1) { next = "ParteA"; targets = {101:115, 102:115, 103:0, 104:0}; }
        else if (code === 2) { next = "ParteB"; targets = {101:105, 102:105, 103:80, 104:50}; }
        else if (code === 3) { next = "Final"; targets = {101:80, 102:80, 103:127, 104:127}; }

        const isLow = (t) => t === "Início" || t === "ParteA";
        if (isLow(old) && !isLow(next)) {
            await sendSysex([0x43, 0x04, 0x05, 0x00, 0x0E, 0x00, 0x00, 0x00, 0x01]);
            await sendSysex([0x43, 0x04, 0x06, 0x00, 0x0E, 0x00, 0x00, 0x00, 0x00]);
        } else if (!isLow(old) && isLow(next)) {
            await sendSysex([0x43, 0x04, 0x06, 0x00, 0x0E, 0x00, 0x00, 0x00, 0x01]);
            await sendSysex([0x43, 0x04, 0x05, 0x00, 0x0E, 0x00, 0x00, 0x00, 0x00]);
        }
        currentTransition = next; currentTransIndex = code;
        document.getElementById('disp-trans').innerText = next;
        runTransition(targets);
    }

    function runTransition(targets) {
    timerWorker.postMessage({ action: 'stop' });
    let step = 0, steps = 40, startVals = { ...ccLevels };
    
    timerWorker.onmessage = () => {
        step++; const ratio = step/steps;
        Object.keys(targets).forEach(cc => {
            let val = startVals[cc] + (targets[cc] - startVals[cc]) * ratio;
            ccLevels[cc] = val;
            
            // Curva Logarítmica para Volume (Percepção humana)
            let logVal = Math.round(127 * Math.pow(val / 127, 1.5));
            
            output.send([0xB0, parseInt(cc), logVal]);
            
            // Atualiza Barra e Valor Numérico
            document.getElementById(`bar${cc}`).style.height = (logVal / 127 * 100) + '%';
            document.getElementById(`val-${cc}`).innerText = logVal;
        });
        
        document.getElementById('disp-time').innerText = `${((steps - step) * 0.1).toFixed(1)}s`;
        if (step >= steps) timerWorker.postMessage({ action: 'stop' });
    };
    timerWorker.postMessage({ action: 'start', interval: 100 });
}

    async function setKeyboardMode(mode) {
        currentKeyboardMode = mode;
        document.getElementById('disp-mode').innerText = mode;
        if (mode === "Natural") {
            await sendSysex([0x43, 0x04, 0x07, 0x00, 0x23, 0x00, 0x00, 0x00, 0x7F]);
            await sendSysex([0x43, 0x04, 0x05, 0x00, 0x23, 0x00, 0x00, 0x00, 0x7F]);
            await sendSysex([0x43, 0x04, 0x06, 0x00, 0x23, 0x00, 0x00, 0x00, 0x7F]);
            for(let ch of CHS_1_5) {
                await sendSysex([0x43, 0x04, ch, 0x00, 0x1D, 0x00, 0x00, 0x00, 0x6C]);
                await sendSysex([0x43, 0x04, ch, 0x00, 0x1F, 0x00, 0x00, 0x00, 0x18]);
                await sendSysex([0x43, 0x04, ch, 0x00, 0x16, 0x00, 0x00, 0x00, 0x00]);
            }
        } else if (mode === "Baixo") {
            await sendSysex([0x43, 0x04, 0x07, 0x00, 0x23, 0x00, 0x00, 0x00, 0x01]);
            await sendSysex([0x43, 0x04, 0x05, 0x00, 0x23, 0x00, 0x00, 0x00, 0x7F]);
            await sendSysex([0x43, 0x04, 0x06, 0x00, 0x23, 0x00, 0x00, 0x00, 0x7F]);
            for(let ch of CHS_1_5) {
                await sendSysex([0x43, 0x04, ch, 0x00, 0x1D, 0x00, 0x00, 0x00, 0x6C]);
                await sendSysex([0x43, 0x04, ch, 0x00, 0x1F, 0x00, 0x00, 0x00, 0x41]);
                await sendSysex([0x43, 0x04, ch, 0x00, 0x16, 0x00, 0x7F, 0x7F, 0x74]);
            }
        } else if (mode === "Solo") {
            await sendSysex([0x43, 0x04, 0x07, 0x00, 0x23, 0x00, 0x00, 0x00, 0x7F]);
            await sendSysex([0x43, 0x04, 0x05, 0x00, 0x23, 0x00, 0x00, 0x00, 0x01]);
            await sendSysex([0x43, 0x04, 0x06, 0x00, 0x23, 0x00, 0x00, 0x00, 0x01]);
            for(let ch of CHS_1_5) {
                await sendSysex([0x43, 0x04, ch, 0x00, 0x1F, 0x00, 0x00, 0x00, 0x18]);
                await sendSysex([0x43, 0x04, ch, 0x00, 0x1D, 0x00, 0x00, 0x00, 0x3B]);
                await sendSysex([0x43, 0x04, ch, 0x00, 0x16, 0x00, 0x00, 0x00, 0x0C]);
            }
        }
    }

    async function resetGeral() {
        timerWorker.postMessage({ action: 'stop' });
        document.getElementById('disp-time').innerText = "0.0s";
        await sendSysex([0x43, 0x0F, 0x00, 0x00, 0x05, 0x00, 0x00, 0x00, 0x01]);
        await sendSysex([0x6D, 0x05, 0x00, 0x00, 0x03, 0x00, 0x00, 0x00, 0x01]);
        await sendSysex([0x6D, 0x05, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]);
    }
</script>
</body>
</html>
