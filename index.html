<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nautilus v1.5 Final</title>
    <style>
        :root { --bg: #050505; --text: #f0f0f0; --accent: #0a84ff; --danger: #ff453a; --success: #32d74b; --panel: #111; }
        html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100%; width: 100%; position: fixed; touch-action: none; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        .active { display: flex; }
        #setup select, #setup button { width: 80%; max-width: 300px; padding: 15px; margin: 10px; border-radius: 8px; font-size: 16px; background: #222; color: #fff; border: 1px solid #444; }
        #main-container { display: flex; width: 100vw; height: 85vh; }
        .q-display { flex: 1.2; padding: 30px; border-right: 2px solid #222; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
        .q-mixer { flex: 0.8; padding: 10px; background: var(--panel); display: flex; flex-direction: column; justify-content: center; }
        .val-chan { font-size: 42px; font-weight: 900; color: #666; line-height: 1; text-transform: uppercase; }
        .val-trans { font-size: 48px; font-weight: 900; color: var(--accent); line-height: 1.1; }
        .row-time { display: flex; align-items: baseline; gap: 15px; margin-top: 10px; }
        .val-bpm { font-size: 24px; font-weight: 700; color: var(--success); }
        .val-time { font-size: 32px; font-weight: 700; color: #fff; }
        .val-mode { font-size: 24px; font-weight: 700; color: #aaa; }
        .mixer { display: flex; justify-content: space-around; align-items: flex-end; height: 180px; gap: 10px; }
        .bar-outer { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 8px; }
        .cc-value { font-size: 12px; color: var(--accent); font-family: monospace; font-weight: bold; }
        .bar-container { width: 40px; height: 130px; background: #000; border-radius: 4px; position: relative; overflow: hidden; border: 1px solid #333; }
        .bar-fill { position: absolute; bottom: 0; width: 100%; background: linear-gradient(to top, #0a84ff, #5efce8); transition: height 0.1s linear; }
    </style>
</head>
<body>

    <audio id="silent-audio" loop><source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA=="></audio>

    <div id="setup" class="screen active">
        <h2 style="color: var(--accent)">Nautilus v2.0.3</h2>
        <button id="btn-init">MIDI</button>
        <select id="midi-in"></select>
        <select id="midi-out"></select>
        <button id="btn-ok" style="background: var(--success); border:none;">CONECTAR</button>
    </div>

    <div id="main" class="screen">
        <div id="main-container">
            <div class="q-display">
                <div id="disp-chan" class="val-chan">OFF</div>
                <div id="disp-trans" class="val-trans">Início</div>
                <div class="row-time">
                    <div id="disp-bpm" class="val-bpm">40 BPM</div>
                    <div id="disp-time" class="val-time">0.0s</div>
                </div>
                <div id="disp-mode" class="val-mode">Natural</div>
            </div>
            <div class="q-mixer">
                <div class="mixer">
                    <div class="bar-outer"><div id="val-101" class="cc-value">127</div><div class="bar-container"><div id="bar101" class="bar-fill"></div></div></div>
                    <div class="bar-outer"><div id="val-102" class="cc-value">0</div><div class="bar-container"><div id="bar102" class="bar-fill"></div></div></div>
                    <div class="bar-outer"><div id="val-103" class="cc-value">0</div><div class="bar-container"><div id="bar103" class="bar-fill"></div></div></div>
                    <div class="bar-outer"><div id="val-104" class="cc-value">0</div><div class="bar-container"><div id="bar104" class="bar-fill"></div></div></div>
                </div>
            </div>
        </div>
    </div>

<script>
    let midiAccess = null, input = null, output = null, isMidiActive = false;
    let currentTransIndex = 0, currentKeyboardMode = "Natural";
    let keyboardModeOnly = false, isInstantMode = false, isOndulacaoMode = false;
    let ccLevels = { 101: 127, 102: 0, 103: 0, 104: 0 }, bpm = 40;
    let clockCount = 0, lastClockTime = 0, lastClockReceived = 0;
    let ondulacaoInterval = null, ondulacaoVals = { 101: 120, 102: 90, 103: 60, 104: 30 }, ondulacaoDirs = { 101: 1, 102: 1, 103: 1, 104: 1 };

    const SYSEX_HDR = [0xF0, 0x42, 0x30, 0x00, 0x01, 0x5D];
    const CHS_1_5 = [0x00, 0x01, 0x02, 0x03, 0x04];

    const timerWorkerCode = `let t = null; self.onmessage = e => { if(e.data.action==='start'){ t=setInterval(()=>self.postMessage('tick'),e.data.interval)} else clearInterval(t); }`;
    const timerWorker = new Worker(URL.createObjectURL(new Blob([timerWorkerCode], {type: 'text/javascript'})));

    document.getElementById('btn-init').onclick = async () => {
        try {
            midiAccess = await navigator.requestMIDIAccess({ sysex: true });
            const i = document.getElementById('midi-in'), o = document.getElementById('midi-out');
            i.innerHTML = ""; o.innerHTML = "";
            midiAccess.inputs.forEach(p => i.add(new Option(p.name, p.id)));
            midiAccess.outputs.forEach(p => o.add(new Option(p.name, p.id)));
        } catch(e) { console.log("Sem dispositivos MIDI."); }
    };

    document.getElementById('btn-ok').onclick = () => {
        if (midiAccess) {
            input = midiAccess.inputs.get(document.getElementById('midi-in').value);
            output = midiAccess.outputs.get(document.getElementById('midi-out').value);
            if (input) input.onmidimessage = handleMidi;
        }
        document.getElementById('setup').classList.remove('active');
        document.getElementById('main').classList.add('active');
        document.getElementById('silent-audio').play();
    };

    async function sendSysex(data) {
        if (!output) return;
        output.send([...SYSEX_HDR, ...data, 0xF7]);
        await new Promise(r => setTimeout(r, 12));
    }

    async function handleMidi(e) {
        const d = Array.from(e.data);
        const hex = d.map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
        const status = d[0] & 0xF0, channel = d[0] & 0x0F, now = Date.now();

        if (d[0] === 0xF8) {
            const cNow = performance.now(); clockCount++;
            if (clockCount >= 24) {
                if (lastClockTime > 0) bpm = 60000 / (cNow - lastClockTime);
                lastClockTime = cNow; clockCount = 0; lastClockReceived = now;
                document.getElementById('disp-bpm').innerText = `${Math.round(bpm)} BPM`;
            }
            return;
        }

        // --- ESCUTA MODOS DE TECLADO ---
        if (hex.includes("5D 43 1B 00 00 06")) {
            if (hex.endsWith("01 00 00 01")) await setKeyboardMode("Baixo");
            else if (hex.endsWith("00 00 00 01")) await setKeyboardMode("Solo");
            else await setKeyboardMode("Natural");
            return;
        }

        if (status === 0xC0) {
            const kIdx = currentTransIndex, kMode = currentKeyboardMode;
            stopOndulacao(); isInstantMode = false; isOndulacaoMode = false;
            await new Promise(r => setTimeout(r, 350));
            const chanL = document.getElementById('disp-chan');
            if (channel === 6) { chanL.innerText = "Ondulação"; isMidiActive = true; isOndulacaoMode = true; startOndulacao(); }
            else if (channel === 5) { chanL.innerText = "Instantâneo"; isMidiActive = true; isInstantMode = true; await handleTransitionTrigger(kIdx); }
            else if (channel === 4) { chanL.innerText = "Transição"; isMidiActive = true; keyboardModeOnly = false; await setKeyboardMode(kMode); await syncHardwareInstant(); }
            else if (channel === 3) { chanL.innerText = "Padrão"; isMidiActive = true; keyboardModeOnly = true; currentTransIndex = 0; await setKeyboardMode(kMode); await syncHardwareInstant(); }
            else { chanL.innerText = "OFF"; isMidiActive = false; }
            return;
        }

        if (hex.includes("5D 6D 05 00 00 05")) await sendSysex([0x43, 0x04, 0x0B, 0x00, 0x0E, 0x00, 0x00, 0x00, d[14] ? 0x00 : 0x01]);
        if (hex.includes("5D 6D 05 00 00 04")) await sendSysex([0x43, 0x04, 0x0A, 0x00, 0x0E, 0x00, 0x00, 0x00, d[14] ? 0x00 : 0x01]);
        if (hex.includes("5D 6D 05 00 00 03 00 00 00 01")) { await resetGeral(); setTimeout(() => sendSysex([0x6D, 0x05, 0x00, 0x00, 0x03, 0x00, 0x00, 0x00, 0x00]), 500); }

        if (!isMidiActive || isOndulacaoMode) return;

        if (status === 0xB0 && !keyboardModeOnly) {
            if (d[1] === 1 && d[2] >= 40 && !upLock && (now - lastJoystickTime > 300)) {
                if (currentTransIndex < 3) handleTransitionTrigger(currentTransIndex + 1);
                upLock = true; lastJoystickTime = now;
            } else if (d[1] === 2 && d[2] >= 40 && !downLock && (now - lastJoystickTime > 300)) {
                if (currentTransIndex > 0) handleTransitionTrigger(currentTransIndex - 1);
                downLock = true; lastJoystickTime = now;
            } else if (d[2] < 15) { upLock = false; downLock = false; }
        }
    }

    async function setKeyboardMode(mode) {
        currentKeyboardMode = mode;
        document.getElementById('disp-mode').innerText = mode;
        if (!output) return;

        // --- LÓGICA DE EXCLUSIVIDADE SW1 (BAIXO) / SW2 (SOLO) ---
        if (mode === "Baixo") {
            await sendSysex([0x43, 0x1B, 0x00, 0x00, 0x06, 0x01, 0x00, 0x00, 0x01]); // Ativa SW1
            await sendSysex([0x43, 0x1B, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x00]); // Desativa SW2
            await sendSysex([0x43, 0x04, 0x07, 0x00, 0x23, 0x00, 0x00, 0x00, 0x01]);
            await sendSysex([0x43, 0x04, 0x05, 0x00, 0x23, 0x00, 0x00, 0x00, 0x7F]);
            await sendSysex([0x43, 0x04, 0x06, 0x00, 0x23, 0x00, 0x00, 0x00, 0x7F]);
            for(let ch of CHS_1_5) {
                await sendSysex([0x43, 0x04, ch, 0x00, 0x1D, 0x00, 0x00, 0x00, 0x6C]);
                await sendSysex([0x43, 0x04, ch, 0x00, 0x1F, 0x00, 0x00, 0x00, 0x41]);
                await sendSysex([0x43, 0x04, ch, 0x00, 0x16, 0x00, 0x7F, 0x7F, 0x74]);
            }
        } else if (mode === "Solo") {
            await sendSysex([0x43, 0x1B, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01]); // Ativa SW2
            await sendSysex([0x43, 0x1B, 0x00, 0x00, 0x06, 0x01, 0x00, 0x00, 0x00]); // Desativa SW1
            await sendSysex([0x43, 0x04, 0x07, 0x00, 0x23, 0x00, 0x00, 0x00, 0x7F]);
            await sendSysex([0x43, 0x04, 0x05, 0x00, 0x23, 0x00, 0x00, 0x00, 0x01]);
            await sendSysex([0x43, 0x04, 0x06, 0x00, 0x23, 0x00, 0x00, 0x00, 0x01]);
            for(let ch of CHS_1_5) {
                await sendSysex([0x43, 0x04, ch, 0x00, 0x1F, 0x00, 0x00, 0x00, 0x18]);
                await sendSysex([0x43, 0x04, ch, 0x00, 0x1D, 0x00, 0x00, 0x00, 0x3B]);
                await sendSysex([0x43, 0x04, ch, 0x00, 0x16, 0x00, 0x00, 0x00, 0x0C]);
            }
        } else {
            await sendSysex([0x43, 0x1B, 0x00, 0x00, 0x06, 0x01, 0x00, 0x00, 0x00]); // Desativa SW1
            await sendSysex([0x43, 0x1B, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x00]); // Desativa SW2
            await sendSysex([0x43, 0x04, 0x07, 0x00, 0x23, 0x00, 0x00, 0x00, 0x7F]);
            await sendSysex([0x43, 0x04, 0x05, 0x00, 0x23, 0x00, 0x00, 0x00, 0x7F]);
            await sendSysex([0x43, 0x04, 0x06, 0x00, 0x23, 0x00, 0x00, 0x00, 0x7F]);
            for(let ch of CHS_1_5) {
                await sendSysex([0x43, 0x04, ch, 0x00, 0x1D, 0x00, 0x00, 0x00, 0x6C]);
                await sendSysex([0x43, 0x04, ch, 0x00, 0x1F, 0x00, 0x00, 0x00, 0x18]);
                await sendSysex([0x43, 0x04, ch, 0x00, 0x16, 0x00, 0x00, 0x00, 0x00]);
            }
        }
    }

    async function handleTransitionTrigger(code) {
        currentTransIndex = code;
        document.getElementById('disp-trans').innerText = ["Início","ParteA","ParteB","Final"][code];
        if (isInstantMode) {
            const targets = [{101:127,102:0,103:0,104:0},{101:0,102:127,103:0,104:0},{101:0,102:0,103:127,104:0},{101:0,102:0,103:0,104:127}][code];
            await syncHardwareInstant(targets);
            return;
        }
        await sendSysex([0x6D, 0x05, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, code]);
        await updateChannelMutes(code);
        const targets = [{101:127,102:0,103:0,104:0},{101:115,102:115,103:0,104:0},{101:105,102:105,103:80,104:50},{101:80,102:80,103:127,104:127}][code];
        runTransition(targets);
    }

    async function updateChannelMutes(code) {
        const m6 = (code < 2) ? 0x00 : 0x01, m7 = (code < 2) ? 0x01 : 0x00;
        await sendSysex([0x43, 0x04, 0x05, 0x00, 0x0E, 0x00, 0x00, 0x00, m6]);
        await sendSysex([0x43, 0x04, 0x06, 0x00, 0x0E, 0x00, 0x00, 0x00, m7]);
    }

    function runTransition(targets) {
        timerWorker.postMessage({ action: 'stop' });
        const duration = (bpm / 10) * 1000;
        let step = 0, steps = duration / 50, startVals = { ...ccLevels };
        timerWorker.onmessage = () => {
            step++; const ratio = Math.min(step/steps, 1);
            Object.keys(targets).forEach(cc => {
                let v = startVals[cc] + (targets[cc] - startVals[cc]) * ratio;
                ccLevels[cc] = v;
                let log = Math.round(127 * Math.pow(v / 127, 1.5));
                if (output) output.send([0xB0, parseInt(cc), log]);
                document.getElementById(`bar${cc}`).style.height = (log/127*100)+'%';
                document.getElementById(`val-${cc}`).innerText = log;
            });
            document.getElementById('disp-time').innerText = `${((duration - (step*50))/1000).toFixed(1)}s`;
            if (step >= steps) timerWorker.postMessage({ action: 'stop' });
        };
        timerWorker.postMessage({ action: 'start', interval: 50 });
    }

    async function syncHardwareInstant(customT = null) {
        const code = currentTransIndex;
        await sendSysex([0x6D, 0x05, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, code]);
        await updateChannelMutes(code);
        let targets = customT || [{101:127,102:0,103:0,104:0},{101:115,102:115,103:0,104:0},{101:105,102:105,103:80,104:50},{101:80,102:80,103:127,104:127}][code];
        Object.keys(targets).forEach(cc => {
            let log = Math.round(127 * Math.pow(targets[cc] / 127, 1.5));
            if (output) output.send([0xB0, parseInt(cc), log]);
            ccLevels[cc] = targets[cc];
            document.getElementById(`bar${cc}`).style.height = (log/127*100)+'%';
            document.getElementById(`val-${cc}`).innerText = log;
        });
        document.getElementById('disp-trans').innerText = ["Início","ParteA","ParteB","Final"][code];
    }

    function startOndulacao() {
        stopOndulacao();
        ondulacaoInterval = setInterval(() => {
            let step = (40 / bpm) * 5;
            Object.keys(ondulacaoVals).forEach(cc => {
                ondulacaoVals[cc] += (step * ondulacaoDirs[cc]);
                if (ondulacaoVals[cc] >= 125 || ondulacaoVals[cc] <= 30) ondulacaoDirs[cc] *= -1;
                let log = Math.round(127 * Math.pow(ondulacaoVals[cc] / 127, 1.5));
                if (output) output.send([0xB0, parseInt(cc), log]);
                document.getElementById(`bar${cc}`).style.height = (log/127*100)+'%';
                document.getElementById(`val-${cc}`).innerText = log;
            });
        }, 100);
    }

    function stopOndulacao() { if(ondulacaoInterval) clearInterval(ondulacaoInterval); ondulacaoInterval = null; }

    async function resetGeral() {
        stopOndulacao(); timerWorker.postMessage({ action: 'stop' });
        await sendSysex([0x43, 0x0F, 0x00, 0x00, 0x05, 0x00, 0x00, 0x00, 0x01]);
        currentTransIndex = 0; await syncHardwareInstant();
    }

    setInterval(() => { if (Date.now() - lastClockReceived > 2000) { bpm = 40; document.getElementById('disp-bpm').innerText = "40 BPM"; } }, 2000);
</script>
</body>
</html>
